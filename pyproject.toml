[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jamieosros-speculative_decode_hit_rate_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出算子库维护工程师·投机解码的命中率上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jamieosros" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jamieosros.github.io"
Repository = "https://github.com/jamieosros/speculative_decode_hit_rate_grouping"
Issues = "https://github.com/jamieosros/speculative_decode_hit_rate_grouping/issues"

[project.scripts]
speculative_decode_hit_rate_grouping = "speculative_decode_hit_rate_grouping:main"

[tool.setuptools]
py-modules = ["speculative_decode_hit_rate_grouping"]
